agent:
  system_template:
    $mini_template: mini-swe-v5.yaml
    field: agent.system_template
  instance_template:
    $mini_template: mini-swe-v5.yaml
    field: agent.instance_template
  step_limit: 0
  cost_limit: 3.0
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template:
    $mini_template: mini-swe-v5.yaml
    field: model.observation_template
  format_error_template:
    $mini_template: mini-swe-v5.yaml
    field: model.format_error_template
  model_kwargs:
    drop_params: true
