services:
  main:
    pull_policy: never
    read_only: true
    user: 65532:65532
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    volumes:
    - production:/workspace/libs/langchain_v1/langchain/agents/middleware
    - development-tests:/workspace/libs/langchain_v1/tests/unit_tests
volumes:
  production: {}
  development-tests: {}
